# Прод на одном сервере: nginx (HTTPS) → сайт Next.js и API Django; воркер и beat Celery, PostgreSQL, Redis.
# Настройки — в .env рядом с этим файлом (пример: .env.production.example). Запуск описан в README, «Выкладка».

x-backend: &backend
  image: kurai-api
  build: ./backend
  env_file: .env
  restart: unless-stopped
  environment: &backend-env
    DJANGO_DEBUG: "0"
    DJANGO_ALLOWED_HOSTS: ${KURAI_DOMAIN:?set KURAI_DOMAIN in .env}
    CORS_ALLOWED_ORIGINS: https://${KURAI_DOMAIN}
    KURAI_FRONTEND_URL: https://${KURAI_DOMAIN}
    OPENROUTER_SITE_URL: https://${KURAI_DOMAIN}
    DATABASE_URL: postgresql://kurai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/kurai
    CELERY_BROKER_URL: redis://redis:6379/0
    KURAI_EVENT_REDIS_URL: redis://redis:6379/0
    REDIS_CACHE_URL: redis://redis:6379/1
    KURAI_QUEUE_RUNS: "1"
    KURAI_LOCAL_EXECUTE_RUNS: "0"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kurai
      POSTGRES_USER: kurai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurai -d kurai"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # порт API наружу не открыт, к нему ходит только nginx — его X-Forwarded-For можно брать как адрес клиента
      FORWARDED_ALLOW_IPS: "*"
    command: >-
      sh -c "python manage.py migrate --noinput &&
      exec gunicorn kurai.asgi:application --bind 0.0.0.0:8000 --workers 3
      --worker-class uvicorn.workers.UvicornWorker --access-logfile - --error-logfile -"
    volumes:
      - media-data:/app/user-media

  worker:
    <<: *backend
    command: celery -A kurai worker --loglevel=INFO --concurrency=2
    volumes:
      - media-data:/app/user-media

  beat:
    <<: *backend
    command: celery -A kurai beat --loglevel=INFO

  web:
    image: kurai-web
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_KURAI_API_BASE_URL: https://${KURAI_DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${KURAI_DOMAIN}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    # страницы с живым каталогом читают API по публичному адресу — пусть он ведёт прямо на nginx этого сервера
    extra_hosts:
      - "${KURAI_DOMAIN}:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      KURAI_DOMAIN: ${KURAI_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/kurai.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    # раз в 6 часов перечитывает сертификаты: certbot продлевает их сам
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  postgres-data:
  redis-data:
  media-data:
  certbot-certs:
  certbot-www:
