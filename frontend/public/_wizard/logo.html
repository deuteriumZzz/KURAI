<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KURAI — логотип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#070A0E;color:#E4EEF7;font:15px/1.55 system-ui,sans-serif;padding:28px 16px 60px}
h1{font:300 26px "Exo 2",sans-serif;margin:0 0 6px;letter-spacing:.02em}.sub{color:#9DAEC2;margin:0 0 22px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;max-width:1300px}
.c{border:1px solid #243040;background:#0D1218;display:flex;flex-direction:column}
.c header{padding:12px 16px;border-bottom:1px solid #243040;display:flex;justify-content:space-between;align-items:baseline}
.c header b{font:500 12px "JetBrains Mono",monospace;letter-spacing:.14em;color:#00E8F0}.c header span{font:12px "JetBrains Mono",monospace;color:#72859B}
.stage{height:190px;display:grid;place-items:center;background:#070A0E;border-bottom:1px solid #243040;
 background-image:linear-gradient(#131a22 1px,transparent 1px),linear-gradient(90deg,#131a22 1px,transparent 1px);background-size:24px 24px}
.row{display:flex;gap:18px;align-items:flex-end;padding:14px 16px;border-bottom:1px solid #243040}
.row div{display:flex;flex-direction:column;align-items:center;gap:6px;font:10.5px "JetBrains Mono",monospace;color:#72859B}
.note{padding:12px 16px;color:#9DAEC2;font-size:13.5px}
.light{background:#E4EEF7}
</style></head><body>
<h1>Логотип KURAI · 4 концепта</h1>
<p class="sub">Все внутри ДНК: графит, один cyan, срез угла, угловые скобки, линии 1px. Под каждым — знак приложения в размерах 180 / 32 / 16 px и на светлом фоне (письма, документы). <b style="color:#00E8F0">暗い (kurai)</b> по-японски — «тёмный»: история бренда для тёмного интерфейса.</p>
<div class="grid" id="g"></div>
<script>
const ACC="#00E8F0",INK="#E4EEF7",LINE="#34445A",BG="#0D1218";
const marks={
 // 1: словесный знак с «A» как лучом захвата
 1:(c=ACC,ink=INK)=>`<svg viewBox="0 0 64 64"><path d="M8 4h48l4 4v48l-4 4H8l-4-4V8z" fill="${BG}" stroke="${LINE}"/><path d="M20 46 32 16 44 46" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="square"/><path d="M25 36h14" stroke="${ink}" stroke-width="3"/></svg>`,
 // 2: монограмма K из двух срезанных штрихов + скобки захвата
 2:(c=ACC,ink=INK)=>`<svg viewBox="0 0 64 64"><rect x="2" y="2" width="60" height="60" fill="${BG}"/><path d="M8 18V8h10M56 46v10H46" fill="none" stroke="${c}" stroke-width="2.5"/><path d="M22 14v36" stroke="${ink}" stroke-width="5"/><path d="M44 14 28 32l16 18" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="miter"/></svg>`,
 // 3: знак «暗» упрощён до геометрии: солнце за чертой (тёмный) + скан-линия
 3:(c=ACC,ink=INK)=>`<svg viewBox="0 0 64 64"><path d="M10 2h44l8 8v44l-8 8H10l-8-8V10z" fill="${BG}"/><circle cx="32" cy="28" r="13" fill="none" stroke="${ink}" stroke-width="3"/><path d="M10 36h44" stroke="${BG}" stroke-width="10"/><path d="M12 36h40" stroke="${c}" stroke-width="3"/><path d="M18 46h28M24 53h16" stroke="${LINE}" stroke-width="2.5"/></svg>`,
 // 4: плитка Breach Protocol: K в срезанном квадрате с кодом
 4:(c=ACC,ink=INK)=>`<svg viewBox="0 0 64 64"><path d="M2 2h48l12 12v48H14L2 50z" fill="${BG}" stroke="${c}" stroke-width="2"/><path d="M20 16v32M42 16 26 32l16 16" fill="none" stroke="${ink}" stroke-width="4.5"/><text x="46" y="57" font-family="JetBrains Mono,monospace" font-size="8" fill="${c}">1C</text></svg>`,
};
const words={
 1:`<span style="font:500 30px 'Exo 2';letter-spacing:.42em">KUR<span style="color:${ACC}">A</span>I</span>`,
 2:`<span style="display:flex;align-items:center;gap:14px"><span style="width:44px">${marks[2]()}</span><span style="font:300 30px 'Exo 2';letter-spacing:.34em">KURAI</span></span>`,
 3:`<span style="display:flex;align-items:center;gap:14px"><span style="width:44px">${marks[3]()}</span><span style="font:300 30px 'Exo 2';letter-spacing:.34em">KURAI</span><span style="font:12px 'JetBrains Mono';color:#72859B">暗い</span></span>`,
 4:`<span style="display:flex;align-items:center;gap:14px"><span style="width:44px">${marks[4]()}</span><span style="font:500 28px 'Exo 2';letter-spacing:.3em">KUR<span style="color:${ACC}">A</span>I</span></span>`,
};
const info={
 1:["СЛОВЕСНЫЙ","«A» — луч захвата. Продолжение текущей надписи: меньше всего меняет вид, но знак приложения слабее."],
 2:["МОНОГРАММА K","Буква K из прямого штриха и cyan-стрелки + угловые скобки захвата. Лучше всех читается в 16 px. Рекомендую."],
 3:["ТЁМНОЕ СОЛНЦЕ","Солнце, срезанное горизонтом, и скан-линия: смысл «暗い — тёмный». Самый «брендовый», сложнее в 16 px."],
 4:["ПЛИТКА BREACH","K в плитке со срезом угла и кодом 1C из матрицы взлома. Сильная отсылка к CP2077, на грани «игровости»."],
};
document.getElementById('g').innerHTML=Object.keys(marks).map(k=>`<section class="c"><header><b>${k} · ${info[k][0]}</b><span>вариант ${k}</span></header>
<div class="stage">${words[k]}</div>
<div class="row"><div><span style="width:90px;display:block">${marks[k]()}</span>180</div><div><span style="width:32px;display:block">${marks[k]()}</span>32</div><div><span style="width:16px;display:block">${marks[k]()}</span>16</div>
<div style="margin-left:auto"><span class="light" style="width:48px;display:block;padding:4px">${marks[k]("#008C99","#0D1218")}</span>светлый</div></div>
<p class="note">${info[k][1]}</p></section>`).join('');
</script></body></html>
