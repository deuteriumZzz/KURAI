<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KURAI — палитра</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;500&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#050506;color:#E9EEF2;font:15px/1.55 Geist,system-ui,sans-serif;padding:24px 16px 60px}
h1{font:300 26px "Exo 2",sans-serif;margin:0 0 4px;letter-spacing:.02em}.sub{color:#8a93a0;margin:0 0 20px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;max-width:1300px}
.v{background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column}
.v>header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--line)}
.v>header b{font:500 13px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--acc)}
.v>header span{font:12px "JetBrains Mono",monospace;color:var(--ink3)}
.body{display:grid;grid-template-columns:92px 1fr;min-height:430px}
.side{background:var(--g1);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.side i{font-style:normal;padding:5px 6px}.side i.on{background:var(--g2);color:var(--ink);box-shadow:inset 2px 0 0 var(--acc)}
.main{padding:16px;display:flex;flex-direction:column;gap:12px}
.h{font:200 26px/1.1 "Exo 2",sans-serif;color:var(--ink);margin:0}.h b{font-weight:500;color:var(--acc)}
.p{color:var(--ink2);font-size:13.5px;margin:0}
.mono{font:11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 13px Geist,sans-serif;border:1px solid var(--line2);background:var(--g2);color:var(--ink);padding:9px 14px}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.card{background:var(--g1);border:1px solid var(--line);padding:12px;font-size:13px;color:var(--ink2)}
.card.sel{border-color:var(--accl);position:relative}
.card.sel::before,.card.sel::after{content:"";position:absolute;width:9px;height:9px;border:solid var(--acc)}
.card.sel::before{top:-4px;left:-4px;border-width:1px 0 0 1px}.card.sel::after{bottom:-4px;right:-4px;border-width:0 1px 1px 0}
.inp{background:var(--g1);border:1px solid var(--accl);box-shadow:0 0 0 3px var(--accs);padding:10px 12px;color:var(--ink);font-size:14px}
.inp small{color:var(--ink3);font:11px "JetBrains Mono",monospace;float:right}
.bars{display:flex;gap:2px}.bars i{flex:1;height:7px;background:var(--line)}.bars i.on{background:var(--acc)}
.sys{font:12px "JetBrains Mono",monospace;color:var(--ink3)}.sys.a{color:var(--acc)}.sys.w{color:#F2B44B}.sys.e{color:#FF4D5E}.sys.o{color:#3DDC97}
.sw{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line)}
.sw div{height:34px}.sw span{display:block;font:9.5px "JetBrains Mono",monospace;color:var(--ink3);padding:4px 5px;background:var(--bg)}
.cr{padding:10px 16px;border-top:1px solid var(--line);font:11.5px "JetBrains Mono",monospace;color:var(--ink3)}
.k{font:11px "JetBrains Mono",monospace;border:1px solid var(--line2);padding:1px 5px;color:var(--ink2)}
@media (max-width:420px){.body{grid-template-columns:1fr}.side{display:none}}
</style></head><body>
<h1>Палитра KURAI · шаг 2</h1>
<p class="sub">Три варианта внутри ДНК. Везде: фон, текст, главная и вторичная кнопки, карточка, выбранная карточка, поле в фокусе, шкала, системные строки. Контраст по WCAG 2.2 — внизу каждого варианта.</p>
<div class="grid" id="g"></div>
<script>
var V=[
 {n:'1 · ГРАФИТ',d:'нейтрально-холодный, как в макетах',bg:'#0A0B0D',g1:'#111317',g2:'#171A1F',line:'#2A2F37',line2:'#3A404A',ink:'#E9EEF2',ink2:'#A7B0BB',ink3:'#7A8390',acc:'#00E8F0',ai:'#031214',accl:'rgba(0,232,240,.38)',accs:'rgba(0,232,240,.10)',c:'текст 16,9 · вторичный 9,0 · метки 4,9 · акцент 12,9 · кнопка 12,5'},
 {n:'2 · KIROSHI',d:'синеватый графит, техничнее и холоднее',bg:'#070A0E',g1:'#0D1218',g2:'#131A22',line:'#243040',line2:'#34445A',ink:'#E4EEF7',ink2:'#9DAEC2',ink3:'#72859B',acc:'#38E8FF',ai:'#03121A',accl:'rgba(56,232,255,.38)',accs:'rgba(56,232,255,.10)',c:'текст 16,9 · вторичный 8,8 · метки 5,0 · акцент 13,4 · кнопка 12,8'},
 {n:'3 · НЕЙТРАЛ',d:'чистые серые, акцент мятная бирюза',bg:'#0A0A0A',g1:'#131313',g2:'#1A1A1A',line:'#2C2C2C',line2:'#3D3D3D',ink:'#EEF0F1',ink2:'#A9ADB0',ink3:'#7E8387',acc:'#1AF5D8',ai:'#02120F',accl:'rgba(26,245,216,.38)',accs:'rgba(26,245,216,.10)',c:'текст 17,3 · вторичный 8,8 · метки 4,9 · акцент 14,2 · кнопка 13,8'}];
document.getElementById('g').innerHTML=V.map(function(v){var st='--bg:'+v.bg+';--g1:'+v.g1+';--g2:'+v.g2+';--line:'+v.line+';--line2:'+v.line2+';--ink:'+v.ink+';--ink2:'+v.ink2+';--ink3:'+v.ink3+';--acc:'+v.acc+';--acc-ink:'+v.ai+';--accl:'+v.accl+';--accs:'+v.accs;
 return '<section class="v" style="'+st+'"><header><b>'+v.n+'</b><span>'+v.d+'</span></header><div class="body"><div class="side"><i>+ Новый</i><i class="on">Чаты</i><i>Медиа</i><i>Баланс</i></div><div class="main">'+
 '<div class="mono">Один интерфейс · 300+ моделей</div><h2 class="h">Нейросети — <b>в одном терминале</b></h2><p class="p">Текст, изображения, видео и голос в едином чате. Цена каждого запроса видна до отправки.</p>'+
 '<div class="row"><button class="btn p">Отправить</button><button class="btn">Пополнить</button><span class="k">Enter</span></div>'+
 '<div class="inp">Нарисуй обложку для этой сводки<small>≈ 16 кр</small></div>'+
 '<div class="row" style="align-items:stretch"><div class="card" style="flex:1">Claude Sonnet 5<br><span class="mono">≈ 2 кр</span></div><div class="card sel" style="flex:1">Nano Banana Pro<br><span class="mono" style="color:var(--acc)">выбрана</span></div></div>'+
 '<div><div class="row" style="justify-content:space-between"><span class="mono">Баланс</span><span class="sys" style="color:var(--ink)">1 248 кр</span></div><div class="bars"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></div></div>'+
 '<div class="sys a">› GPT-5 · EU-01 · 310 мс</div><div class="sys w">› нет ответа → переключаюсь на резерв</div><div class="sys e">› ошибка: файл больше 50 МБ</div><div class="sys o">● все системы в норме</div>'+
 '</div></div><div class="sw">'+[['фон',v.bg],['графит',v.g1],['графит 2',v.g2],['линия',v.line],['текст',v.ink],['акцент',v.acc]].map(function(s){return '<div style="background:'+s[1]+'"></div>'}).join('')+'</div><div class="sw">'+[['фон',v.bg],['графит',v.g1],['графит 2',v.g2],['линия',v.line],['текст',v.ink],['акцент',v.acc]].map(function(s){return '<span>'+s[0]+'<br>'+s[1]+'</span>'}).join('')+'</div><div class="cr">Контраст: '+v.c+' · всё ≥ AA</div></section>'}).join('');
</script></body></html>
