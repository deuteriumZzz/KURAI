components:
  schemas:
    AccentEnum:
      enum:
      - cyan
      - magenta
      - lime
      - violet
      type: string
      description: |-
        * `cyan` - cyan
        * `magenta` - magenta
        * `lime` - lime
        * `violet` - violet
    ArtifactEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ArtifactOutput'
      required:
      - data
    ArtifactInput:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          default: document
        title:
          type: string
          maxLength: 160
          minLength: 1
      required:
      - messageId
    ArtifactListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactOutput'
      required:
      - data
    ArtifactOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
        chatId:
          type: string
          format: uuid
        sourceMessageId:
          type: string
          format: uuid
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        provenance:
          type: object
          additionalProperties: {}
        createdAt:
          type: string
          format: date-time
      required:
      - body
      - chatId
      - createdAt
      - id
      - kind
      - projectId
      - provenance
      - sourceMessageId
      - title
    ChatEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ChatOutput'
      required:
      - data
    ChatInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
          minLength: 1
        projectId:
          type: string
          format: uuid
          nullable: true
      required:
      - title
    ChatListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChatOutput'
      required:
      - data
    ChatOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        projectId:
          type: string
          format: uuid
          nullable: true
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - pinned
      - projectId
      - title
    ChatSnapshotData:
      type: object
      properties:
        chat:
          $ref: '#/components/schemas/ChatOutput'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageOutput'
      required:
      - chat
      - messages
    ChatSnapshotEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ChatSnapshotData'
      required:
      - data
    CompareRoute:
      type: object
      properties:
        modelId:
          type: string
          maxLength: 160
        quoteId:
          type: string
          format: uuid
      required:
      - modelId
      - quoteId
    CompareRunEnvelope:
      type: object
      properties:
        data:
          type: object
          additionalProperties: {}
      required:
      - data
    CompareRunInput:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        mode:
          $ref: '#/components/schemas/CompareRunInputModeEnum'
        attachmentIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
        text:
          type: string
          maxLength: 20000
          minLength: 1
        routes:
          type: array
          items:
            $ref: '#/components/schemas/CompareRoute'
      required:
      - chatId
