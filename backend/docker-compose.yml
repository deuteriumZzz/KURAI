services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kurai
      POSTGRES_USER: kurai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurai -d kurai"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  api:
    build: .
    env_file: ${KURAI_ENV_FILE:-.env.production}
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn kurai.asgi:application --bind 0.0.0.0:8000 --workers 3
      --worker-class uvicorn.workers.UvicornWorker --access-logfile - --error-logfile -"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media-data:/app/user-media

  worker:
    build: .
    env_file: ${KURAI_ENV_FILE:-.env.production}
    command: celery -A kurai worker --loglevel=INFO --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media-data:/app/user-media

  beat:
    build: .
    env_file: ${KURAI_ENV_FILE:-.env.production}
    command: celery -A kurai beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  media-data:
