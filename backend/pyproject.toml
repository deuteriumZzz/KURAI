[project]
name = "kurai-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "django-cors-headers>=4.7,<4.8",
  "djangorestframework>=3.16,<3.17",
  "drf-spectacular>=0.28,<0.29",
  "celery>=5.5,<5.6",
  "redis>=5.2,<6",
  "psycopg[binary]>=3.2,<3.3",
  "gunicorn>=23,<24",
  "uvicorn[standard]>=0.35,<0.36",
  "python-pptx>=1.0,<1.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kurai*", "accounts*", "workspace*", "ledger*", "model_catalog*", "runs*", "sharing*", "files*", "media*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kurai.settings"
python_files = ["test_*.py", "*_test.py"]
